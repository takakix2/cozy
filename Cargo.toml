[package]
name = "cozy"
version = "0.2.36"
edition = "2024"
rust-version = "1.88"
description = "A Comfort First terminal editor and pager: type like nano, navigate like vim"
license = "MIT OR Apache-2.0"
repository = "https://github.com/takakix2/cozy"
homepage = "https://labs.navii.online/"
readme = "README.md"
keywords = ["editor", "tui", "terminal", "text-editor", "vim"]
categories = ["command-line-utilities", "text-editors"]
# Ship only the crate itself; dev docs/logs/plans live on the repo, not the tarball.
include = [
    "src/**/*.rs",
    # The Mermaid grammar and the licence of the code copied from ratatui-markdown.
    "src/vendor/**/*.pest",
    "src/vendor/**/LICENSE-*",
    "/Cargo.toml",
    "/README.md",
    "/README.ja.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/config.example.toml",
]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
regex = "1.12.2"
unicode-width = "0.1"
# The Markdown/Mermaid code copied from ratatui-markdown (src/vendor) measures with 0.2,
# like ratatui itself; cozy's own width code stays on 0.1.
unicode_width_02 = { package = "unicode-width", version = "0.2" }
pest = "2"
pest_derive = "2"
encoding_rs = "0.8"
ignore = "0.4"
arboard = { version = "3.2", optional = true }
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-md = { version = "0.5", features = ["parser"], optional = true }
atomicwrites = "0.4.4"
# 端末内画像ビューア（`#20` Phase 1・feature `imageview`）。
# 🚚 2026-10-03 に [dev-dependencies]（PoC 専用）から昇格。
# 🚨 `avif` は入れない —— image 0.25 の `avif` は**書く側**（rav1e エンコーダ）で、読むのは
# `avif-native`（dav1d・C ライブラリ）。入れても AVIF は開けず、エンコーダだけが乗っていた。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico", "bmp"], optional = true }
fast_image_resize = { version = "6", optional = true }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"], optional = true }

# XTSMGRAPHICS の交渉（fd 0 の poll/read・unix だけ。他の面では交渉せず 256 色へ落ちる）。
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
# Only the tests copied from ratatui-markdown (src/vendor) use it.
anyhow = "1"
# `sixel4096` のラウンドトリップ検体だけが使う（自前エンコーダの出力を**別実装**で復号して
# 原画と突き合わせる）。ratatui-image 経由で lock には既に居る版（0.5.1・追加コストなし）。
icy_sixel = "0.5"


[features]
default = ["clipboard", "crossterm-events", "treesitter", "imageview"]
clipboard = ["dep:arboard"]
# 端末内画像ビューア（`#20`）。CLI（czv/cozy）だけの面 —— 分岐は `run_cli_mode` に在り、
# 埋め込みホスト（argotty の `run()` 直呼び）はこの道を通らない。軽くしたい embed は外す。
imageview = ["dep:image", "dep:fast_image_resize", "dep:ratatui-image", "dep:libc"]
# Disable when embedding in a host that provides its own event source (e.g. hsh-ios)
crossterm-events = []
# tree-sitter syntax highlighting. Disable for a lighter embed; falls back to the
# regex highlighter in src/utils/syntax.rs.
treesitter = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-json",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-md",
]

[lib]
name = "cozy"
path = "src/lib.rs"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
